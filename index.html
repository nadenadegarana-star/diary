<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
  <title>日記</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="cal-pane">
      <header class="cal-head">
        <button id="prev" class="icon-btn" aria-label="前の月">‹</button>
        <h1 id="month-label"></h1>
        <button id="next" class="icon-btn" aria-label="次の月">›</button>
        <button id="today" class="text-btn">今日</button>
      </header>
      <div class="weekdays">
        <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
      </div>
      <div id="grid" class="grid"></div>
      <footer class="cal-foot">
        <button id="export" class="text-btn">バックアップ保存</button>
        <label class="text-btn">読み込み<input id="import" type="file" accept="application/json" hidden></label>
      </footer>
    </section>

    <section class="edit-pane">
      <header class="edit-head">
        <button id="back" class="text-btn back">‹ カレンダー</button>
        <h2 id="date-label"></h2>
        <span id="status" class="status"></span>
      </header>
      <textarea id="text" placeholder="今日のこと…"></textarea>
    </section>
  </main>

  <dialog id="import-dialog">
    <form method="dialog">
      <h3>バックアップを読み込む</h3>
      <p id="import-summary"></p>
      <p class="note">マージ：日付ごとに新しい方を残します。<br>置き換え：今のデータを全部消して入れ替えます（直前のデータは自動で保存されます）。</p>
      <div class="dlg-actions">
        <button value="cancel" class="text-btn">やめる</button>
        <button value="replace" class="text-btn">置き換え</button>
        <button value="merge" class="primary-btn">マージ</button>
      </div>
    </form>
  </dialog>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
